# ============================================================================
#  Android-Build für MathFunctions Explorer
#  --------------------------------------------------------------------------
#  Zwei Betriebsarten, damit sofort etwas Installierbares herauskommt:
#
#   A) Ohne Keystore  – jeder Push auf main und jeder manuelle Start erzeugt
#      eine Debug-APK je Ausgabe (Pro und Lite). Die lässt sich direkt auf ein
#      Telefon ziehen und installieren. Für den Play Store taugt sie nicht.
#
#   B) Mit Keystore   – sobald die vier Secrets gesetzt sind und ein Tag der
#      Form v1.2.3 gepusht wird, entstehen zusätzlich eine signierte APK und
#      ein signiertes AAB und hängen an der GitHub-Release.
#      Fehlen die Secrets, läuft der Lauf trotzdem durch und legt die
#      unsignierten Dateien ab – kein roter Haken, nur ein Hinweis im Log.
#
#  Benötigte Secrets (Settings → Secrets and variables → Actions):
#      ANDROID_KEYSTORE_BASE64   base64 -w0 mein.keystore
#      ANDROID_KEYSTORE_PASSWORD
#      ANDROID_KEY_ALIAS
#      ANDROID_KEY_PASSWORD
#
#  Der Ordner android/ darf im Repo fehlen; er wird hier erzeugt.
# ============================================================================

name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # nötig, um Dateien an eine Release zu hängen

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        edition: [pro, lite]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ACHTUNG, hier stand einmal `cache: gradle` - das war ein Fehler.
      # setup-java bildet den Cache-Schluessel aus den Gradle-Dateien im
      # Arbeitsverzeichnis und BRICHT AB, wenn es keine findet. Der Ordner
      # android/ entsteht aber erst weiter unten aus `npx cap add android`.
      # Der Gradle-Cache liegt deshalb in einem eigenen Schritt.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle-Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # android/ ist erzeugt, nicht eingecheckt - der Schluessel haengt
          # deshalb an den Dateien, aus denen es entsteht.
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'capacitor.config.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: android-actions/setup-android@v3

      # --------------------------------------------------------------------
      # Kennzahlen festlegen. versionCode muss bei jedem Play-Upload steigen,
      # deshalb die fortlaufende Laufnummer. versionName kommt aus dem Tag,
      # ersatzweise aus package.json.
      # --------------------------------------------------------------------
      - name: Version bestimmen
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            RELEASE=true
          else
            VERSION="$(node -p "require('./package.json').version")"
            RELEASE=false
          fi
          echo "version=$VERSION"                   >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE"                   >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_OUTPUT"
          echo "Ausgabe ${{ matrix.edition }}, Version $VERSION, Release=$RELEASE"

      - name: Abhängigkeiten installieren
        run: |
          set -euo pipefail
          # npm ci verlangt eine Lockdatei; die gibt es hier nicht zwingend.
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Erst pruefen, dann bauen. Ein fehlender Uebersetzungsschluessel oder
      # ein toter Element-Verweis soll hier auffallen, nicht auf dem Telefon.
      - name: Selbsttest
        run: npm test

      # --------------------------------------------------------------------
      # www/ erzeugen. Für Lite bekommt die App eine eigene Anwendungskennung
      # und einen eigenen Namen, sonst könnten Lite und Pro nicht nebeneinander
      # im Play Store stehen und nicht gleichzeitig installiert sein.
      # --------------------------------------------------------------------
      - name: Webdateien bauen
        run: |
          set -euo pipefail
          if [ "${{ matrix.edition }}" = "lite" ]; then
            npm run build:lite
            node -e "
              const fs = require('fs'), p = 'capacitor.config.json';
              const c = JSON.parse(fs.readFileSync(p, 'utf8'));
              c.appId   = c.appId.replace(/\.lite\$/, '') + '.lite';
              c.appName = c.appName.replace(/ Lite\$/, '') + ' Lite';
              fs.writeFileSync(p, JSON.stringify(c, null, 2));
              console.log('Lite-Kennung:', c.appId, '|', c.appName);
            "
          else
            npm run build
          fi
          test -f www/index.html || { echo '::error::www/index.html fehlt – build-www.mjs prüfen'; exit 1; }
          # Rechtsseiten müssen in der App liegen, nicht nur auf der Website:
          for f in impressum.html datenschutz.html ueber.html recht.css; do
            test -f "www/$f" || echo "::warning::$f fehlt in www/ – Dateiliste in tools/build-www.mjs ergänzen"
          done

      - name: Android-Projekt erzeugen
        run: |
          set -euo pipefail
          if [ ! -d android ]; then npx cap add android; else npx cap sync android; fi
          # Ohne diese Datei laeuft der Gradle-Aufruf spaeter in eine
          # unverstaendliche Fehlermeldung.
          test -f android/app/build.gradle || {
            echo '::error::android/app/build.gradle fehlt - npx cap add android ist fehlgeschlagen'
            exit 1
          }
          # Capacitor schreibt versionCode 1 / versionName "1.0" in die Vorlage.
          sed -i -E "s/versionCode( *=)? *[0-9]+/versionCode \1 ${{ steps.meta.outputs.code }}/" android/app/build.gradle
          sed -i -E "s/versionName( *=)? *\"[^\"]*\"/versionName \1 \"${{ steps.meta.outputs.version }}\"/" android/app/build.gradle
          grep -nE 'versionCode|versionName|applicationId' android/app/build.gradle || true
          chmod +x android/gradlew

      # --------------------------------------------------------------------
      # Debug-APK: läuft immer, braucht keinen Schlüssel.
      # --------------------------------------------------------------------
      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Debug-APK benennen
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/mathfunctions-${{ matrix.edition }}-${{ steps.meta.outputs.version }}-debug.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v6
        with:
          name: apk-debug-${{ matrix.edition }}
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------------------
      # Ab hier nur bei einem Tag v*.
      # --------------------------------------------------------------------
      - name: Liegt ein Keystore vor?
        if: steps.meta.outputs.release == 'true'
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Keine Signatur-Secrets gesetzt – es entstehen unsignierte Dateien."
          fi

      - name: Release-APK und AAB bauen
        if: steps.meta.outputs.release == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Signieren
        if: steps.meta.outputs.release == 'true' && steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:     ${{ secrets.ANDROID_KEY_PASSWORD }}
          EDITION:      ${{ matrix.edition }}
          VERSION:      ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Ausserhalb des Arbeitsbaums ablegen, damit der Schluessel nicht
          # versehentlich in einem Artefakt landet.
          KS="$(mktemp -d)/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"

          # --- APK: erst ausrichten, dann signieren (apksigner verlangt diese
          #     Reihenfolge, sonst bricht die Ausrichtung beim Signieren) ---
          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS" --ks-pass "env:STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "env:KEY_PASS" \
            --out "dist/mathfunctions-$EDITION-$VERSION.apk" aligned.apk
          "$BT/apksigner" verify --verbose "dist/mathfunctions-$EDITION-$VERSION.apk"

          # --- AAB: jarsigner, apksigner kann keine Bundles ---
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)"
          jarsigner -verbose:summary -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KS" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -signedjar "dist/mathfunctions-$EDITION-$VERSION.aab" "$AAB" "$KEY_ALIAS"

          shred -u "$KS" 2>/dev/null || rm -f "$KS"
          ls -lh dist

      - name: Unsignierte Release-Dateien ablegen
        if: steps.meta.outputs.release == 'true' && steps.signing.outputs.available != 'true'
        run: |
          set -euo pipefail
          find android/app/build/outputs/apk/release    -name '*.apk' -exec cp {} "dist/mathfunctions-${{ matrix.edition }}-${{ steps.meta.outputs.version }}-unsigned.apk" \;
          find android/app/build/outputs/bundle/release -name '*.aab' -exec cp {} "dist/mathfunctions-${{ matrix.edition }}-${{ steps.meta.outputs.version }}-unsigned.aab" \;
          ls -lh dist

      - uses: actions/upload-artifact@v6
        if: steps.meta.outputs.release == 'true'
        with:
          name: release-${{ matrix.edition }}
          path: |
            dist/*.aab
            dist/mathfunctions-*[0-9].apk
            dist/*-unsigned.apk
          if-no-files-found: warn
          retention-days: 90

      - name: An die GitHub-Release hängen
        if: steps.meta.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
