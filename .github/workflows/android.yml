# ==========================================================================
# Baut ein signiertes Android App Bundle (AAB) fuer den Play Store.
#
# VORAUSSETZUNG: der Ordner android/ muss im Repo liegen. Er entsteht einmalig
# lokal mit Internetzugang:
#
#     npm install
#     npm run android:add        # ruft cap add android auf
#     git add android && git commit -m "Android-Projekt"
#
# Danach baut dieser Workflow bei jedem Tag "v*" ein Release-Bundle.
#
# BENOETIGTE SECRETS (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   base64 des Signaturschluessels
#                             erzeugen mit:  base64 -w0 upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Der Schluessel gehoert NIEMALS ins Repo. Geht er verloren, laesst sich die
# App im Play Store nicht mehr aktualisieren - eine Sicherungskopie ausserhalb
# von GitHub anlegen.
# ==========================================================================
name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      flavour:
        description: 'Ausgabe'
        type: choice
        options: [full, lite]
        default: full

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android-Projekt vorhanden?
        run: |
          if [ ! -d android ]; then
            echo "::error::Der Ordner android/ fehlt. Einmalig lokal 'npm run android:add' ausfuehren und einchecken."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhaengigkeiten
        run: npm ci

      - name: Web-Dateien einsammeln
        run: |
          if [ "${{ inputs.flavour }}" = "lite" ]; then
            npm run build:lite
          else
            npm run build
          fi

      - name: In das Android-Projekt uebertragen
        run: npx cap sync android

      # versionCode muss bei jedem Upload steigen, sonst weist der Play Store
      # das Bundle zurueck. Die laufende Nummer des Workflows erfuellt das.
      - name: Versionsnummern setzen
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Signaturschluessel bereitstellen
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      # Signierung ueber Gradle-Properties: so muss build.gradle nicht
      # angefasst werden und im Repo steht kein Passwort.
      - name: Bundle bauen und signieren
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Schluessel wieder entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle-${{ inputs.flavour || 'full' }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
